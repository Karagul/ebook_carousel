<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ebook Business Swipe Cards</title>

  <!-- Optional: your own tweaks -->
  <link rel="stylesheet" href="carousel.css">

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">

  <!-- --------  CUSTOM STYLES  -------- -->
  <style>
    /* GLOBAL */
    body {
      background: rgb(136, 6, 6); /* maroon */
      font-family: "Century Gothic", "Helvetica Neue", sans-serif;
      color: #ffffff;
      margin: 0;
    }
    h2.text-center {
      margin: 40px 0 30px;
      font-weight: bold;
      font-size: 32px;
    }

    /* CAROUSEL */
    .carousel { margin-bottom: 40px; }
    .carousel .item {
      background: transparent !important; /* kill grey panel */
      padding: 20px;
      transition: transform 0.4s ease-in-out;
    }
    .carousel .item img {
      max-width: 90%;
      height: auto;
      margin: auto;
      display: block;
      border-radius: 12px;
      background: #ffffff;   /* white card */
    }

    .carousel-control.left,
    .carousel-control.right {
      background-image: none;
      color: #880606;
      font-size: 36px;
      text-shadow: none;
    }
    .carousel-control:hover { color: #dddddd; }

    .container { padding-top: 20px; }
  </style>
</head>

<body>

<div class="container text-center">
  <h2>📚 Ebook Swipe File Carousel</h2>

  <!-- MANUAL carousel, no auto-slide -->
  <div id="swipeCarousel" class="carousel slide" data-ride="carousel" data-interval="false">
    <div class="carousel-inner">

      <div class="item active">
        <img src="swipe_card_1.png" alt="Card 1">
      </div>

      <div class="item">
        <img src="swipe_card_2.png" alt="Card 2">
      </div>

      <div class="item">
        <img src="swipe_card_3.png" alt="Card 3">
      </div>

      <div class="item">
        <img src="swipe_card_4.png" alt="Card 4">
      </div>

      <div class="item">
        <img src="swipe_card_5.png" alt="Card 5">
      </div>

      <div class="item">
        <img src="swipe_card_6.png" alt="Card 6">
      </div>

      <div class="item">
        <img src="swipe_card_7.png" alt="Card 7">
      </div>

    </div>

    <!-- NAVIGATION ARROWS -->
    <a class="left carousel-control"  href="#swipeCarousel" data-slide="prev">
      <span class="glyphicon glyphicon-chevron-left"></span>
    </a>
    <a class="right carousel-control" href="#swipeCarousel" data-slide="next">
      <span class="glyphicon glyphicon-chevron-right"></span>
    </a>
  </div>
</div>

<!-- jQuery 1.12.4 (compatible with Bootstrap 3) -->
<script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>

<!-- Bootstrap 3.4.1 JS -->
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>

<!-- Disable wrap (stop at last slide) -->
<script>
  $('#swipeCarousel').carousel({
    wrap: false
  });
</script>

</body>
</html>
